name: Build Meal Diary APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create package.json
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Meal Diary
        run: |
          mkdir -p www
          cp MealDiary-5.html www/index.html

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.varun.mealdiary",
            "appName": "Meal Diary",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin dependency conflicts
        run: |
          cat >> android/build.gradle <<'GRADLE'

          subprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          GRADLE

      - name: Install native backup bridge
        run: |
          mkdir -p android/app/src/main/java/com/varun/mealdiary

          cat > android/app/src/main/java/com/varun/mealdiary/MainActivity.java <<'JAVA'
          package com.varun.mealdiary;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(
                new MealDiaryNativeBridge(), "MealDiaryNative");
            }

            private class MealDiaryNativeBridge {
              @JavascriptInterface
              public boolean saveBackup(String filename, String base64Data) {
                OutputStream output = null;
                try {
                  byte[] data = Base64.decode(base64Data, Base64.DEFAULT);
                  String safeName = filename == null
                    ? "meal-diary-backup.json"
                    : filename.replaceAll("[^A-Za-z0-9._-]", "_");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    ContentValues values = new ContentValues();
                    values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                    values.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                    values.put(MediaStore.MediaColumns.RELATIVE_PATH,
                      Environment.DIRECTORY_DOWNLOADS + "/mealdiaryrevo/");

                    Uri uri = getContentResolver().insert(
                      MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                    if (uri == null) return false;

                    output = getContentResolver().openOutputStream(uri);
                    if (output == null) return false;
                    output.write(data);
                    output.flush();
                    output.close();
                    return true;
                  }

                  File dir = new File(
                    Environment.getExternalStoragePublicDirectory(
                      Environment.DIRECTORY_DOWNLOADS), "mealdiaryrevo");

                  if (!dir.exists() && !dir.mkdirs()) return false;

                  File file = new File(dir, safeName);
                  output = new FileOutputStream(file);
                  output.write(data);
                  output.flush();
                  output.close();
                  return true;
                } catch (Exception e) {
                  try {
                    if (output != null) output.close();
                  } catch (Exception ignored) {}
                  return false;
                }
              }
            }
          }
          JAVA

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meal-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
