name: Build Meal Diary Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare app files
        run: |
          mkdir -p www
          cp MealDiary-5.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "meal-diary",
            "version": "1.0.0",
            "private": true
          }
          EOF

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.varun.mealdiary",
            "appName": "Meal Diary",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Install native backup bridge
        run: |
          mkdir -p android/app/src/main/java/com/varun/mealdiary

          cat > android/app/src/main/java/com/varun/mealdiary/MainActivity.java <<'JAVA'
          package com.varun.mealdiary;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(
                new MealDiaryNativeBridge(), "MealDiaryNative");
            }

            private class MealDiaryNativeBridge {
              @JavascriptInterface
              public boolean saveBackup(String filename, String base64Data) {
                OutputStream output = null;
                try {
                  byte[] data = Base64.decode(base64Data, Base64.DEFAULT);
                  String safeName = filename == null
                    ? "meal-diary-backup.json"
                    : filename.replaceAll("[^A-Za-z0-9._-]", "_");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    ContentValues values = new ContentValues();
                    values.put(MediaStore.MediaColumns.DISPLAY_NAME, safeName);
                    values.put(MediaStore.MediaColumns.MIME_TYPE, "application/json");
                    values.put(MediaStore.MediaColumns.RELATIVE_PATH,
                      Environment.DIRECTORY_DOWNLOADS);

                    Uri uri = getContentResolver().insert(
                      MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                    if (uri == null) return false;

                    output = getContentResolver().openOutputStream(uri);
                    if (output == null) return false;
                    output.write(data);
                    output.flush();
                    output.close();
                    return true;
                  }

                  File dir = Environment.getExternalStoragePublicDirectory(
                    Environment.DIRECTORY_DOWNLOADS);
                  if (!dir.exists() && !dir.mkdirs()) return false;

                  File file = new File(dir, safeName);
                  output = new FileOutputStream(file);
                  output.write(data);
                  output.flush();
                  output.close();
                  return true;
                } catch (Exception e) {
                  try {
                    if (output != null) output.close();
                  } catch (Exception ignored) {}
                  return false;
                }
              }
            }
          }
          JAVA

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meal-Diary-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
